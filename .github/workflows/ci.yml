name: Pruebas

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Verificar que dist/Codigo.gs está actualizado
        run: |
          npm run build:gas
          git diff --exit-code apps-script/dist/Codigo.gs
